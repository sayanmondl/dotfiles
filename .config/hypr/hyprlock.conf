# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#



# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

$font = JetBrainsMono Nerd Font

# Colors
$rosewater = rgb(f5e0dc)
$rosewaterAlpha = f5e0dc

$flamingo = rgb(f2cdcd)
$flamingoAlpha = f2cdcd

$pink = rgb(f5c2e7)
$pinkAlpha = f5c2e7

$mauve = rgb(cba6f7)
$mauveAlpha = cba6f7

$red = rgb(f38ba8)
$redAlpha = f38ba8

$maroon = rgb(eba0ac)
$maroonAlpha = eba0ac

$peach = rgb(fab387)
$peachAlpha = fab387

$yellow = rgb(f9e2af)
$yellowAlpha = f9e2af

$green = rgb(a6e3a1)
$greenAlpha = a6e3a1

$teal = rgb(94e2d5)
$tealAlpha = 94e2d5

$sky = rgb(89dceb)
$skyAlpha = 89dceb

$sapphire = rgb(74c7ec)
$sapphireAlpha = 74c7ec

$blue = rgb(89b4fa)
$blueAlpha = 89b4fa

$lavender = rgb(b4befe)
$lavenderAlpha = b4befe

$text = rgb(cdd6f4)
$textAlpha = cdd6f4

$subtext1 = rgb(bac2de)
$subtext1Alpha = bac2de

$subtext0 = rgb(a6adc8)
$subtext0Alpha = a6adc8

$overlay2 = rgb(9399b2)
$overlay2Alpha = 9399b2

$overlay1 = rgb(7f849c)
$overlay1Alpha = 7f849c

$overlay0 = rgb(6c7086)
$overlay0Alpha = 6c7086

$surface2 = rgb(585b70)
$surface2Alpha = 585b70

$surface1 = rgb(45475a)
$surface1Alpha = 45475a

$surface0 = rgb(313244)
$surface0Alpha = 313244

$base = rgb(1e1e2e)
$baseAlpha = 1e1e2e

$mantle = rgb(181825)
$mantleAlpha = 181825

$crust = rgb(11111b)
$crustAlpha = 11111b

$textAlpha22 = cdd6f422
$textAlpha55 = cdd6f455
$textAlpha88 = cdd6f488
$textAlphaCC = cdd6f4cc


general {
    hide_cursor = false
}

animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1.0

    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = ~/Pictures/wallpapers/wall2.jpg

    blur_passes = 4
    blur_size = 6
    noise = 0.02
    contrast = 1.1
    brightness = 0.85
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Profile Picture
image {
    monitor =
    path = ~/Pictures/smallpics/cat2.jpeg
    size = 100
    border_size = 10
    border_color = rgba($textAlpha33)
    position = 0, 200
    halign = center
    valign = bottom
}

#user
label {
    monitor =
    text = Sayan Mondal
    font_family = $font
    color = $light1
    position = 0, 160
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 240, 40
    outline_thickness = 3
    inner_color = rgba($textAlpha33)

    outer_color = rgba($textAlpha33)
    check_color = $red
    fail_color = $red

    font_color = rgba($textAlpha99)
    fade_on_empty = false
    rounding = 40

    font_family = $font
    font_size = 18
    placeholder_text = Password...
    fail_text = 

    dots_size = 0.4
    dots_spacing = 0.3

    position = 0, 80
    halign = center
    valign = bottom
}

# time
label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"

    color = rgba($textAlphaCC)
    font_size = 96
    font_family = $font ExtraBold

    position = 0, -180
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B %Y')"
    color = rgba($textAlphaCC)
    font_size = 14
    font_family = $font
    position = 0, -350
    halign = center
    valign = top
}
